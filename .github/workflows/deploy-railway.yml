name: MANUAL ONLY — Deploy to Railway

# This workflow is intentionally disconnected from contract preparation.
# A human operator may run it from the Actions UI after completing their own review.
on:
  workflow_dispatch: {}

concurrency:
  group: railway-deploy-main
  cancel-in-progress: false

jobs:
  manual-release:
    name: MANUAL ONLY — railway up
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_PROJECT_ID: 64a837fc-1712-492f-b571-e1fec8090cd7
      RAILWAY_ENVIRONMENT: production
      RAILWAY_SERVICE_ID: b33addae-782a-469a-929e-56c8fd09d70c
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.com/install.sh | bash
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"
      - name: Run the human-requested release
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$RAILWAY_SERVICE_ID"
          railway up --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$RAILWAY_SERVICE_ID" --ci
